services:
  postgres:
    image: postgres:18.4
    container_name: imagelab_postgres
    environment:
      POSTGRES_USER: imagelab
      POSTGRES_PASSWORD: password
      POSTGRES_DB: imagelab
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imagelab -d imagelab']
      interval: 1s
      timeout: 5s
      retries: 5
    networks:
      - imagelab_network

  api:
    build: .
    container_name: imagelab_api
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: imagelab
      DB_PASSWORD: password
      DB_NAME: imagelab
    networks:
      - imagelab_network

  web:
    image: caddy:2-alpine
    container_name: imagelab_web
    ports:
      - '5500:5500'
    volumes:
      - ./frontend:/usr/share/caddy
    command: caddy file-server --listen :5500 --root /usr/share/caddy
    networks:
      - imagelab_network

networks:
  imagelab_network:
    name: imagelab_network
    driver: bridge
