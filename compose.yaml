services:
  postgres:
    image: postgres:18.6
    container_name: imagelab_postgres
    environment:
      POSTGRES_USER: imagelab
      POSTGRES_PASSWORD: password
      POSTGRES_DB: imagelab
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imagelab -d imagelab']
      interval: 1s
      timeout: 5s
      retries: 5
    networks:
      - imagelab_network

  api:
    build: .
    container_name: imagelab_api
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: imagelab
      DB_PASSWORD: password
      DB_NAME: imagelab
    networks:
      - imagelab_network

  web:
    image: caddy:2-alpine
    container_name: imagelab_web
    ports:
      - '5500:5500'
    volumes:
      - ./frontend:/usr/share/caddy
    command: caddy file-server --listen :5500 --root /usr/share/caddy
    networks:
      - imagelab_network

  measure:
    image: ghcr.io/astral-sh/uv:python3.14-trixie
    container_name: imagelab_measure
    working_dir: /app/python
    volumes:
      - .:/app
    environment:
      - UV_LINK_MODE=copy
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - imagelab_network
    profiles:
      - tools
    entrypoint: ["sh", "-c"]
    command:
      - |
        cp .envrc.docker .envrc
        export $(cat .envrc | xargs)
        uv run measurement \
          --count 5 \
          --api-url="http://api:$${PORT}" \
          --db-dsn="$${IMAGELAB_DB_DSN}" \
          --image-path="src/measurement/pittsburgh.jpg"

networks:
  imagelab_network:
    name: imagelab_network
    driver: bridge
